<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap">
<style>
:root{--navy:#062a6e;--red:#c8102e;--bg:#fff;--soft:#f3f5fa;--tx:#14203b;--mu:#5a6580;--bd:#e1e6f0;--card:#fff;--hd:#fff;--ac:#062a6e;--btn:#062a6e;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0c1220;--soft:#111a2f;--tx:#e8ecf6;--mu:#9aa6c4;--bd:#243050;--card:#141c32;--hd:#0f1730;--ac:#9bb8ff;--btn:#2b5bd7;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0c1220;--soft:#111a2f;--tx:#e8ecf6;--mu:#9aa6c4;--bd:#243050;--card:#141c32;--hd:#0f1730;--ac:#9bb8ff;--btn:#2b5bd7;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}*{box-sizing:border-box}
body{margin:0;font:15px/1.6 Poppins,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--tx)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--hd);z-index:30}
a{color:inherit;text-decoration:none}h1,h2,h3{margin:0;line-height:1.25}.w{max-width:1160px;margin:auto;padding:0 20px}.mu{color:var(--mu)}
.top{background:var(--navy);color:#dbe4ff;font-size:12.5px}.top .w{display:flex;justify-content:space-between;gap:12px;padding:8px 20px}.top a:hover{color:#fff}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--hd);border-bottom:1px solid var(--bd);box-shadow:0 2px 12px rgba(6,42,110,.06)}
.hr{display:flex;align-items:center;gap:14px;flex-wrap:wrap;padding:10px 20px}
.brand{display:flex;align-items:center;gap:10px;font-weight:700;font-size:21px;color:var(--ac)}.brand b{color:var(--red)}
.logo{width:46px;height:46px;object-fit:contain;background:#fff;border-radius:10px;padding:3px}
.nv{display:flex;gap:2px;margin-left:auto;overflow-x:auto}.nv a{padding:8px 13px;border-radius:8px;font-weight:500;white-space:nowrap;transition:.2s}.nv a:hover,.nv a.on{color:var(--red);background:var(--soft)}
.ua{display:flex;gap:10px;align-items:center}
@media(max-width:760px){.ua{margin-left:auto}.nv{order:3;width:100%;margin:0}}
.btn{display:inline-block;border:0;background:var(--btn);color:#fff;font:600 14px Poppins,system-ui,sans-serif;padding:11px 22px;border-radius:999px;cursor:pointer;transition:.2s}.btn:hover{filter:brightness(1.15);transform:translateY(-1px)}
.btn.red{background:var(--red)}.btn.sm{padding:7px 15px;font-size:13px}.btn.out{background:transparent;color:var(--ac);border:1.5px solid var(--bd)}.btn.danger{background:transparent;color:var(--red);border:1.5px solid var(--bd)}
.av{width:38px;height:38px;border-radius:50%;background:var(--red);color:#fff;display:grid;place-items:center;font-weight:600}.av.big{width:64px;height:64px;font-size:26px}
.hero{background:linear-gradient(135deg,#041b4d,#0a3a94);color:#fff;padding:72px 0 84px;position:relative;overflow:hidden}
.hero::after{content:"";position:absolute;right:-120px;bottom:-180px;width:480px;height:480px;border-radius:50%;background:radial-gradient(circle,rgba(200,16,46,.75),transparent 68%)}
.hero .w{position:relative;z-index:1}.eb{color:#ff9aa9;font-weight:600;letter-spacing:.12em;text-transform:uppercase;font-size:12.5px;margin:0 0 12px}
.hero h1{font-size:clamp(30px,5vw,52px);max-width:720px;font-weight:700}.lead{max-width:560px;color:#c9d6f7;margin:16px 0 28px}
.sb{display:flex;gap:8px;background:#fff;border-radius:999px;padding:6px;max-width:560px}.sb input{flex:1;min-width:0;border:0;outline:0;padding:0 16px;font:inherit;background:transparent;color:#14203b}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-top:-40px;position:relative;z-index:2}
.stats div{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:16px;text-align:center;box-shadow:0 8px 24px rgba(6,42,110,.1)}.stats b{display:block;font-size:22px;color:var(--ac)}.stats span{font-size:12.5px;color:var(--mu)}
@media(max-width:700px){.stats{grid-template-columns:repeat(2,1fr)}}
.sec{padding:44px 20px}h2{font-size:26px;color:var(--ac);position:relative;padding-bottom:10px;margin-bottom:6px}h2::after{content:"";position:absolute;left:0;bottom:0;width:44px;height:3px;background:var(--red);border-radius:2px}
.bar{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;align-items:center;margin:14px 0 22px}.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{border:1.5px solid var(--bd);background:var(--card);color:var(--tx);border-radius:999px;padding:6px 14px;font:500 13px Poppins,system-ui,sans-serif;cursor:pointer;transition:.2s}.chip:hover{border-color:var(--red)}.chip.on{background:var(--navy);border-color:var(--navy);color:#fff}
select,input,textarea{font:inherit;color:var(--tx);background:var(--card);border:1.5px solid var(--bd);border-radius:10px;padding:10px 12px;width:100%}input:focus,select:focus,textarea:focus{outline:2px solid var(--ac);outline-offset:1px}.bar select{width:auto}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:20px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;overflow:hidden;transition:.25s}.card:hover{transform:translateY(-4px);box-shadow:0 14px 30px rgba(6,42,110,.15)}
.im{aspect-ratio:4/3;background:var(--soft);overflow:hidden}.im img{width:100%;height:100%;object-fit:cover}.ph{width:100%;height:100%;display:grid;place-items:center;font-size:56px;background:linear-gradient(135deg,var(--soft),var(--bd))}
.bd{padding:14px 16px}.pr{color:var(--red);font-weight:700;font-size:18px}.bd h3{font-size:15px;font-weight:600;margin:2px 0 4px}.bd p{margin:0;font-size:12.5px;color:var(--mu)}
.soft{background:var(--soft)}.steps{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:18px;margin-top:18px}.steps div{background:var(--card);border-radius:14px;padding:22px;border:1px solid var(--bd)}.steps b{display:grid;place-items:center;width:34px;height:34px;border-radius:50%;background:var(--red);color:#fff;margin-bottom:10px}.steps p{margin:6px 0 0;color:var(--mu);font-size:14px}
.bk{color:var(--ac);font-weight:500;display:inline-block;margin-bottom:18px}.dt{display:grid;grid-template-columns:1.1fr 1fr;gap:34px}@media(max-width:800px){.dt{grid-template-columns:1fr}}
.rail{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;gap:10px;border-radius:14px}.rail .im{flex:0 0 100%;scroll-snap-align:start;border-radius:14px}
.price{font-size:30px;font-weight:700;color:var(--red);margin:4px 0}.kv{display:grid;grid-template-columns:120px 1fr;gap:6px 12px;margin:16px 0;font-size:14px}.kv span{color:var(--mu)}
.box{background:var(--soft);border:1px solid var(--bd);border-radius:14px;padding:16px;margin:14px 0}.box textarea{margin:8px 0}
.st{font-weight:600;text-transform:capitalize}.st.active{color:#0a8a4a}.st.sold,.st.delisted{color:var(--mu)}
.narrow{max-width:640px;margin:auto}.auth{max-width:440px;margin:auto;background:var(--card);border:1px solid var(--bd);border-radius:18px;padding:30px;box-shadow:0 12px 34px rgba(6,42,110,.1)}.auth .logo{width:60px;height:60px;border:1px solid var(--bd);margin-bottom:12px}
form{display:grid;gap:14px;margin-top:18px}label{display:grid;gap:5px;font-size:13px;font-weight:500}.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}#pv{display:flex;gap:8px}#pv img{width:64px;height:64px;object-fit:cover;border-radius:8px}
.pf{display:flex;gap:16px;align-items:center;flex-wrap:wrap;padding-bottom:10px}.pf .btn{margin-left:auto}.pf p{margin:2px 0 0}
.row{display:flex;gap:14px;align-items:center;flex-wrap:wrap;background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:12px;margin-bottom:12px}.row .th{width:72px;height:72px;border-radius:10px;overflow:hidden;flex:none}.row .ph{font-size:30px}.row .th img{width:100%;height:100%;object-fit:cover}.gr{flex:1;min-width:160px}.ac{display:flex;gap:8px;flex-wrap:wrap}
footer{background:var(--navy);color:#b9c8f0;padding:36px 0 28px;font-size:13.5px}footer .w{display:flex;gap:24px;justify-content:space-between;flex-wrap:wrap;align-items:center}footer .brand{color:#fff}footer a:hover{color:#fff}
#toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translate(-50%,30px);background:#14203b;color:#fff;padding:12px 20px;border-radius:999px;opacity:0;pointer-events:none;transition:.3s;z-index:50;font-size:14px}#toast.on{opacity:1;transform:translate(-50%,0)}
ul.rl{line-height:2;padding-left:20px}
</style></head><body>

<section class="soft"><div class="w sec"><h2>How BU Trade works</h2><div class="steps"><div><b>1</b><h3>Sign in with your BU email</h3><p>Only verified Bennett students get in, so you always deal with campus people.</p></div><div><b>2</b><h3>List or browse</h3><p>Add photos, a price and why you’re selling, or search what you need.</p></div><div><b>3</b><h3>Connect and meet</h3><p>Send an enquiry, get the seller’s contact and meet at a public campus spot.</p></div></div></div></section>`;
$("#q").oninput=e=>{f.q=e.target.value;grid()};$("#so").value=f.s;$("#so").onchange=e=>{f.s=e.target.value;grid()};$("#ch").onclick=e=>{const c=e.target.dataset.c;if(c){f.c=c;grid()}};grid()}
function grid(){const q=f.q.toLowerCase(),a=L.filter(l=>l.status=="active");let r=a.filter(l=>(f.c=="All"||l.cat==f.c)&&(l.title+l.desc+l.cat).toLowerCase().includes(q)).sort((x,y)=>f.s=="lo"?x.price-y.price:f.s=="hi"?y.price-x.price:y.ts-x.ts);
$("#n1").textContent=a.length;$("#ch").innerHTML=["All",...CATS.map(c=>c[0])].map(c=>`<button class="chip${f.c==c?" on":""}" data-c="${c}">${c}</button>`).join("");
$("#g").innerHTML=r.length?r.map(l=>`<a class="card" href="#item-${l.id}"><div class="im">${pic(l)}</div><div class="bd"><span class="pr">${rs(l.price)}</span><h3>${esc(l.title)}</h3><p>${esc(l.cat)} · ${esc(l.age)} old</p></div></a>`).join(""):`<p class="mu">No items match your search yet.</p>`}
function item(id){const l=L.find(x=>x.id==id);if(!l)return home();const mine=U&&l.owner==U.email,d=Math.max(0,Math.round((Date.now()-l.ts)/864e5));let c;
if(l.status!="active")c=`<div class="box">This item is no longer available.</div>`;else if(mine)c=`<div class="box">This is your listing. Manage it from <a href="#profile" class="bk">My listings</a>.</div>`;else if(!U)c=`<div class="box"><b>Interested?</b><p class="mu">Sign in with your BU email to contact the seller.</p><a class="btn" href="#login" onclick="nx='item-${l.id}'">Sign in to contact</a></div>`;else if(E.includes(id))c=`<div class="box"><b>Seller’s contact (${esc(l.method)})</b><p style="font-size:18px;margin:6px 0 0">${esc(l.contact)}</p><p class="mu" style="margin:6px 0 0;font-size:13px">Meet in a public campus spot.</p></div>`;else c=`<div class="box"><b>Send an enquiry</b><textarea id="em" rows="2">Hi, is this still available?</textarea><button class="btn red" onclick="enq(${id})">Send enquiry</button><p class="mu" style="margin:8px 0 0;font-size:12.5px">The seller’s contact unlocks once you send it.</p></div>`;
app.innerHTML=`<div class="w sec"><a href="#home" class="bk">← Back to listings</a><div class="dt"><div class="rail">${l.imgs.length?l.imgs.map(s=>`<div class="im"><img src="${s}" alt=""></div>`).join(""):`<div class="im">${pic(l)}</div>`}</div><div><p class="mu" style="margin:0">${esc(l.cat)} · Listed ${d?d+" day"+(d>1?"s":"")+" ago":"today"}</p><h1>${esc(l.title)}</h1><div class="price">${rs(l.price)}</div><div class="kv"><span>Age</span><b>${esc(l.age)}</b><span>Reason</span><b>${esc(l.reason)}</b><span>Seller</span><b>${esc(l.seller)}, ${esc(l.course)} (${esc(l.year)})</b><span>Status</span><b class="st ${l.status}">${l.status}</b></div>${l.desc?`<p>${esc(l.desc)}</p>`:""}${c}<button class="btn sm out" onclick="rep(${id})">Report listing</button></div></div></div>`}
function enq(id){E.push(id);sv("bu_e",E);item(id);toast("Enquiry sent. Seller’s contact unlocked.")}
function rep(id){const r=prompt("Why are you reporting this listing?");if(r){sv("bu_r",[...ld("bu_r",[]),{id,r}]);toast("Thanks, moderators will review it.")}}
function login(){if(U)return location.hash="profile";const s=ls.step,yr=["1st year","2nd year","3rd year","4th year","5th year"].map(y=>`<option>${y}</option>`).join("");
const h=s==1?`<h2>Sign in</h2><p class="mu">Use your Bennett University email. We’ll send a one-time code.</p><form id="fm"><label>University email<input type="email" name="e" placeholder="name${DOM}" required></label><button class="btn">Send code</button></form>`:s==2?`<h2>Enter code</h2><p class="mu">Sent to ${esc(ls.email)}. <em>Demo mode: any 6 digits work.</em></p><form id="fm"><label>6-digit code<input name="o" inputmode="numeric" pattern="\\d{6}" maxlength="6" required></label><button class="btn">Verify</button></form>`:`<h2>About you</h2><p class="mu">Shown to buyers and sellers on listings.</p><form id="fm"><label>Full name<input name="n" required></label><label>Course<input name="c" placeholder="e.g. B.Tech CSE" required></label><div class="two"><label>Year<select name="y">${yr}</select></label><label>Residence<select name="h"><option>Hostel</option><option>Day scholar</option></select></label></div><button class="btn">Finish</button></form>`;
app.innerHTML=`<div class="w sec"><div class="auth"><img class="logo" src="${LOGO}" alt="">${h}</div></div>`;
$("#fm").onsubmit=e=>{e.preventDefault();const d=Object.fromEntries(new FormData(e.target));if(s==1){const m=d.e.trim().toLowerCase();if(!m.endsWith(DOM))return toast("Please use your "+DOM+" email.");ls={step:2,email:m}}else if(s==2)ls.step=3;else{U={email:ls.email,name:d.n.trim(),course:d.c.trim(),year:d.y,hostel:d.h};sv("bu_u",U);ls={step:1,email:""};toast("Welcome to BU Trade!");const t=nx;nx="home";location.hash=t;return}login()}}
function comp(file){return new Promise(r=>{const i=new Image,u=URL.createObjectURL(file);i.onload=()=>{const k=Math.min(1,520/Math.max(i.width,i.height)),c=document.createElement("canvas");c.width=i.width*k;c.height=i.height*k;c.getContext("2d").drawImage(i,0,0,c.width,c.height);URL.revokeObjectURL(u);r(c.toDataURL("image/jpeg",.7))};i.onerror=()=>r(null);i.src=u})}
function sell(){pend=[];app.innerHTML=`<div class="w sec narrow"><h2>List an item</h2><p class="mu">Free to list. Buyers reach you through BU Trade.</p><form id="fm"><label>Title<input name="t" maxlength="80" required></label><div class="two"><label>Price (₹)<input name="p" type="number" min="0" required></label><label>Category<select name="c">${CATS.map(c=>`<option>${c[0]}</option>`).join("")}</select></label></div><div class="two"><label>How old is it?<input name="a" placeholder="e.g. 1 year" required></label><label>Reason for selling<input name="r" required></label></div><label>Description (optional)<textarea name="d" rows="3"></textarea></label><div class="two"><label>Contact method<select name="m"><option>WhatsApp</option><option>Phone</option><option>Email</option></select></label><label>Contact detail<input name="v" required></label></div><label>Photos (up to 3)<input id="ph" type="file" accept="image/*" multiple></label><div id="pv"></div><button class="btn red">Publish listing</button></form></div>`;
$("#ph").onchange=async e=>{pend=(await Promise.all([...e.target.files].slice(0,3).map(comp))).filter(Boolean);$("#pv").innerHTML=pend.map(s=>`<img src="${s}" alt="">`).join("")};
$("#fm").onsubmit=e=>{e.preventDefault();const d=Object.fromEntries(new FormData(e.target));if(L.filter(l=>l.owner==U.email&&l.status=="active").length>=10)return toast("You can have up to 10 active listings.");L.unshift({id:Date.now(),title:d.t.trim(),cat:d.c,price:+d.p,age:d.a.trim(),reason:d.r.trim(),desc:d.d.trim(),seller:U.name,course:U.course,year:U.year,method:d.m,contact:d.v.trim(),ts:Date.now(),status:"active",owner:U.email,imgs:pend});sv("bu_l",L);toast("Listing published!");location.hash="profile"}}
const row=l=>`<div class="row"><div class="th">${pic(l)}</div><div class="gr"><a href="#item-${l.id}"><b>${esc(l.title)}</b></a><div class="mu">${rs(l.price)} · <span class="st ${l.status}">${l.status}</span></div></div><div class="ac">${l.status=="active"?`<button class="btn sm out" onclick="act(${l.id},'sold')">Mark sold</button><button class="btn sm out" onclick="act(${l.id},'delisted')">Delist</button>`:`<button class="btn sm out" onclick="act(${l.id},'active')">Relist</button>`}<button class="btn sm danger" onclick="act(${l.id},'del')">Delete</button></div></div>`;
function profile(){const m=L.filter(l=>l.owner==U.email);app.innerHTML=`<div class="w sec"><div class="pf"><div class="av big">${esc(U.name[0]).toUpperCase()}</div><div><h1>${esc(U.name)}</h1><p class="mu">${esc(U.course)} · ${esc(U.year)} · ${esc(U.hostel)}<br>${esc(U.email)}</p></div><button class="btn out" onclick="out()">Sign out</button></div><div class="bar"><h2>My listings (${m.length})</h2><a class="btn" href="#sell">+ Add product</a></div>${m.length?m.map(row).join(""):`<p class="mu">You haven’t listed anything yet.</p>`}</div>`}
function act(id,s){if(s!="active"&&!confirm("Are you sure?"))return;if(s=="del")L=L.filter(l=>l.id!=id);else L.find(l=>l.id==id).status=s;sv("bu_l",L);profile()}
function out(){U=null;try{localStorage.removeItem("bu_u")}catch(e){}location.hash="home";hdr();toast("Signed out.")}
function rules(){app.innerHTML=`<div class="w sec narrow"><h2>Safety and community rules</h2><ul class="rl"><li>Meet in busy public campus spots such as the library, food court or main gate.</li><li>No illegal, prohibited or fake items. Describe condition honestly.</li><li>Inspect items before paying. Prefer cash or UPI at the time of meeting.</li><li>BU Trade only connects students. We don’t handle payments or delivery.</li><li>Use “Report listing” on anything suspicious. Moderators can remove listings and ban users.</li><li>Active listings are limited to 10 per student.</li></ul></div>`}
document.querySelectorAll(".logo").forEach(i=>i.src=LOGO);addEventListener("hashchange",route);route();
</script></body></html>
